name: Bug report
description: Report reproducible incorrect behavior in Latra
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include secrets or security vulnerabilities here; follow SECURITY.md for private reporting.
  - type: input
    id: version
    attributes:
      label: Latra version
      description: Provide a release version or commit SHA.
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, architecture, and relevant Workshop version.
      placeholder: Ubuntu 24.04, amd64, Workshop v0.9.9
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproducer possible. Do not include credentials or private SDK content.
      placeholder: |
        1. Run ...
        2. Scan ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste sanitized logs, diagnostics, or JSON output.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed secrets and sensitive SDK content from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true

