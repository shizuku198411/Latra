name: Publish snap

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/**'
  release:
    types: [published]

concurrency:
  group: publish-snap-${{ github.event_name == 'release' && 'candidate' || 'edge' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' || !github.event.release.prerelease
    name: Pack and publish to ${{ github.event_name == 'release' && 'candidate' || 'edge' }}
    env:
      CHANNEL: ${{ github.event_name == 'release' && 'latest/candidate' || 'latest/edge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Check out the repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # The job only packs and uploads to the store; it never pushes,
          # so the checked-out token does not need to outlive the step.
          persist-credentials: false

      - name: 🛠 Pack the snap
        id: pack
        uses: canonical/craft-actions/snapcraft/pack@d2add174925f9bca7b0a826010c8e1ce2a4bbc3d # v1

      - name: Verify candidate snap version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SNAPS: ${{ steps.pack.outputs.snaps }}
        run: |
          set -euo pipefail
          expected=$(git describe --long --tags --always --match 'v*.*.*')
          [[ "$expected" == "$RELEASE_TAG"-0-g* ]] || { echo "HEAD does not describe the published release tag"; exit 1; }
          test -n "$SNAPS"
          for snap_file in $SNAPS; do
            actual=$(unsquashfs -cat "$snap_file" meta/snap.yaml | /usr/bin/python3 -c 'import sys, yaml; print(yaml.safe_load(sys.stdin)["version"])')
            [[ "$actual" == "${expected#v}" ]] || { echo "Unexpected snap version: $actual (expected ${expected#v})"; exit 1; }
          done

      - name: Upload and release snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_EDGE }}
          SNAPS: ${{ steps.pack.outputs.snaps }}
        run: |
          set -euo pipefail
          command -v snapcraft >/dev/null || sudo snap install snapcraft --classic
          for snap_file in $SNAPS; do
            snapcraft upload "$snap_file" --release="$CHANNEL"
          done
