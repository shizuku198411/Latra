name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Launch development workshop
        uses: canonical/launch-workshop@b538173e2c4163488c4628b4aef79a6002475e76 # v1
        with:
          workshop: dev

      - name: Check Go formatting
        run: workshop run -- format-check

      - name: Run go vet
        run: workshop run -- vet

      - name: Run Go tests
        run: workshop run -- test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Launch development workshop
        uses: canonical/launch-workshop@b538173e2c4163488c4628b4aef79a6002475e76 # v1
        with:
          workshop: dev

      - name: Build Latra
        run: workshop run -- build

      - name: Run the built binary
        run: workshop exec dev -- ./build/latra version

  e2e:
    name: SDK Store E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Launch development workshop
        uses: canonical/launch-workshop@b538173e2c4163488c4628b4aef79a6002475e76 # v1
        with:
          workshop: dev

      - name: Run SDK Store end-to-end test
        run: workshop run -- e2e
