finding-rules:
  - id: risk.unknown-command-root
    kind: risk
    family: remote-execution
    title: Unknown command runs in a root hook
    severity: medium
    confidence: high
    weight: 25
    match:
      type: unknown-command
      run-as-root: true
    message: A command not covered by the embedded command database runs with root hook privileges.
    remediation: Review the command and add a command database definition when its behavior is understood.

  - id: risk.credential-read
    kind: risk
    family: sensitive-data
    title: Credential-like data is read
    severity: high
    confidence: high
    weight: 50
    match:
      type: capability
      capabilities:
        - credential-read
    message: The hook reads a path classified as credential or sensitive data.
    remediation: Limit the read to the minimum required path and avoid exposing its content.

  - id: risk.external-send
    kind: risk
    family: data-exposure
    title: Data is sent to an external endpoint
    severity: medium
    confidence: high
    weight: 25
    match:
      type: capability
      capabilities:
        - external-send
    message: The hook sends local or generated data to a network endpoint.
    remediation: Review the source data, endpoint, and transport before allowing the transfer.

  - id: risk.dynamic-execution
    kind: risk
    family: remote-execution
    title: Dynamic code executes with project access
    severity: high
    confidence: high
    weight: 50
    match:
      type: capability
      capabilities:
        - dynamic-execution
      hook-names:
        - setup-project
      project-mounted: true
    message: The project setup hook dynamically evaluates code while the Workshop project is mounted.
    remediation: Replace dynamic evaluation with explicit commands and review the complete origin of the evaluated content.

  - id: risk.repository-hook-persistence
    kind: risk
    family: persistence
    title: Repository hook persistence is configured
    severity: high
    confidence: high
    weight: 50
    match:
      type: repository-persistence
      hook-names:
        - setup-project
      project-mounted: true
    message: The project setup hook writes a Git hook or changes the repository hook path.
    remediation: Remove SDK-managed Git hooks and require repository hook changes to be explicitly reviewed by the project owner.

  - id: risk.project-file-modification
    kind: risk
    family: project-integrity
    title: An existing project file is modified in place
    severity: medium
    confidence: high
    weight: 25
    match:
      type: project-in-place-modification
      hook-names:
        - setup-project
      project-mounted: true
    message: The project setup hook uses an in-place editor on a file under the mounted project.
    remediation: Review the exact file and edit expression, and prefer an explicit project-owned setup step when modification is required.

  - id: risk.toolchain-search-order-hijack
    kind: risk
    family: remote-execution
    title: A project-local executable is prepended to the tool search path
    severity: high
    confidence: high
    weight: 50
    match:
      type: toolchain-search-order-hijack
      hook-names:
        - setup-project
      project-mounted: true
    message: The hook creates an executable project file and writes configuration that prepends its directory to PATH.
    remediation: Do not let SDK hooks inject project-local command wrappers ahead of trusted toolchain directories.

  - id: risk.persistence-write
    kind: risk
    family: persistence
    title: Persistent state or startup configuration is written
    severity: medium
    confidence: high
    weight: 25
    match:
      type: persistence-write
    message: The hook writes or changes a location that can retain behavior across sessions or boots.
    remediation: Constrain persistence to documented SDK state and review restored behavior.

  - id: risk.profile-environment-write
    kind: risk
    family: persistence
    title: Shell environment profile is written during base setup
    severity: low
    confidence: high
    weight: 10
    match:
      type: profile-environment-write
      hook-names:
        - setup-base
      run-as-root: true
      project-mounted: false
      interfaces-active: false
      state-mounted: false
    message: Base setup writes statically resolved environment configuration under /etc/profile.d.
    remediation: Keep the profile content declarative and avoid downloading or executing additional payloads from the profile.

  - id: risk.device-write
    kind: risk
    family: destructive
    title: A device or kernel interface is modified
    severity: critical
    confidence: high
    weight: 80
    match:
      type: path-write
      path-classes:
        - device
    message: The hook accesses a device or kernel interface with potentially destructive impact.
    remediation: Confirm the exact target and use the least privileged read-only operation possible.
