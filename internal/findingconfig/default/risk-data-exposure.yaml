finding-rules:
  - id: risk.project-secret-persisted-to-state
    kind: risk
    family: data-exposure
    title: Project-sensitive data is persisted into SDK state
    severity: high
    confidence: high
    weight: 50
    match:
      type: project-secret-to-state
      hook-names:
        - save-state
      state-mounted: true
    message: Sensitive Project data can be carried into persisted SDK state across revisions.
    remediation: Do not persist Project secrets in SDK state; store only minimal, non-sensitive cache data.
    limitations:
      - State channel reachability does not assert byte identity across SDK revisions.

  - id: risk.remote-content-to-project
    kind: risk
    family: supply-chain
    title: Remote content is written into the Workshop project
    severity: medium
    confidence: high
    weight: 25
    match:
      type: relation-flow
      relation-kinds:
        - pipeline
        - substitution-flow
        - variable-flow
        - redirect-flow
      source-capability: network-download
      sink-capability: project-write
      same-operation: true
      project-mounted: true
    message: Content obtained from a remote endpoint flows into the mounted Workshop project.
    remediation: Verify the remote source and pin immutable content before allowing it to modify the project.

  - id: risk.project-data-exfiltration
    kind: risk
    family: data-exposure
    title: Project data flows to an external endpoint
    severity: high
    confidence: high
    weight: 50
    match:
      type: relation-flow
      relation-kinds:
        - pipeline
        - substitution-flow
        - variable-flow
        - redirect-flow
        - artifact-flow
        - collection-flow
      source-capability: project-read
      sink-capability: external-send
      same-operation: true
      project-mounted: true
      interfaces-active: true
    message: Data read from the mounted project flows to an external endpoint.
    remediation: Remove the transfer or restrict it to explicitly approved project data and endpoints.

  - id: risk.project-secret-exfiltration
    kind: risk
    family: data-exposure
    title: Project-sensitive data flows to an external endpoint
    severity: critical
    confidence: high
    weight: 90
    match:
      type: relation-flow
      relation-kinds:
        - pipeline
        - substitution-flow
        - variable-flow
        - redirect-flow
        - artifact-flow
        - collection-flow
      source-capability: project-sensitive-file-read
      sink-capability: external-send
      same-operation: true
      project-mounted: true
      interfaces-active: true
    message: Data read from a sensitive file in the mounted project flows to an external endpoint.
    remediation: Remove the transfer or restrict it to explicitly approved data and endpoints without exposing repository secrets.
