finding-rules:
  - id: assurance.sdk-path-scoped-write
    kind: assurance
    family: scope-limitation
    title: Write is scoped to the SDK path
    strength: medium
    confidence: high
    weight: 30
    match:
      type: path-write
      path-classes:
        - sdk
    message: A write target is classified within the SDK-managed environment.
    limitations:
      - Path scoping does not establish that the written content is trustworthy.

  - id: assurance.state-path-scoped-write
    kind: assurance
    family: scope-limitation
    title: Write is scoped to persisted SDK state
    strength: medium
    confidence: high
    weight: 30
    match:
      type: capability
      capabilities:
        - state-write
    message: A write target is limited to the persisted SDK state path.
    limitations:
      - Path scoping does not establish that persisted content is safe or prevent it from affecting later restore behavior.

  - id: assurance.non-root-hook
    kind: assurance
    family: least-privilege
    title: Hook runs as the Workshop user
    strength: medium
    confidence: high
    weight: 30
    match:
      type: absence-capability
      run-as-root: false
      project-mounted: true
      interfaces-active: true
      state-mounted: false
    message: The Workshop lifecycle runs this hook as the Workshop user rather than container root.
    limitations:
      - The Workshop user can still modify the host-backed mounted Project and user data.
      - Container root may also map to a non-root host user; this assurance only describes the in-container lifecycle identity.
