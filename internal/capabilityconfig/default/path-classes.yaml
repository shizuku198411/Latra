path-classes:
  project-sensitive:
    exact:
      - .env
      - .npmrc
      - .pypirc
      - .netrc
      - .git/config
      - .git-credentials
      - .aws/credentials
      - .config/gcloud/application_default_credentials.json
      - .config/gh/hosts.yml
    prefixes:
      - .ssh/
      - .config/gcloud/
    contains:
      - /.git/config
      - /.git-credentials
      - /.aws/credentials
      - /.config/gcloud/
      - /.config/gh/hosts.yml
      - /.ssh/
    suffixes:
      - .pem
      - .key
    basenames:
      - .env
      - .npmrc
      - .pypirc
      - .netrc
    basename-prefixes:
      - .env.
    excluded-basenames:
      - .env.example
      - .env.sample
      - .env.template
  user-sensitive:
    exact:
      - /root/.npmrc
      - /root/.pypirc
      - /root/.netrc
      - /root/.git-credentials
      - /home/workshop/.npmrc
      - /home/workshop/.pypirc
      - /home/workshop/.netrc
      - /home/workshop/.git-credentials
    prefixes:
      - /root/.ssh/
      - /root/.aws/
      - /root/.config/gcloud/
      - /home/workshop/.ssh/
      - /home/workshop/.aws/
      - /home/workshop/.config/gcloud/
    contains:
      - /.config/gh/hosts.yml
  system-sensitive:
    exact:
      - /etc/shadow
      - /etc/gshadow
      - /etc/sudoers
    prefixes:
      - /etc/sudoers.d/
  unknown-sensitive-candidate:
    suffixes:
      - /.env
      - .pem
      - .key
  sensitive:
    case-insensitive-contains:
      - /.ssh
      - /.aws
      - /.config
      - credential
      - token
      - secret
    suffixes:
      - .pem
      - .key
  persistence:
    contains:
      - /systemd/
      - /cron
      - /profile
      - /.bashrc
      - /.zshrc
      - /.git/hooks/
  state:
    variable-names:
      - SDK_STATE_DIR
    contains:
      - /state/
    suffixes:
      - /state
  sdk:
    variable-names:
      - SDK
    prefixes:
      - /var/lib/workshop/sdk/
    contains:
      - /sdk/
  project:
    exact:
      - /project
    prefixes:
      - /project/
  root-home:
    exact:
      - /root
    prefixes:
      - /root/
  user-home:
    prefixes:
      - /home/workshop/
  runtime:
    prefixes:
      - /run/
  device:
    prefixes:
      - /proc/
      - /sys/
      - /dev/
  temporary:
    prefixes:
      - /tmp/
      - /var/tmp/
  system:
    prefixes:
      - /etc/
      - /usr/
      - /opt/

