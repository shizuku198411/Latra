path-capabilities:
  project-sensitive:
    read:
      id: path.project-sensitive.read
      capability: project-sensitive-file-read
      additional-capabilities:
        - sensitive-file-read
        - project-read
  user-sensitive:
    read:
      id: path.user-sensitive.read
      capability: sensitive-file-read
      additional-capabilities:
        - credential-read
  system-sensitive:
    read: {id: path.system-sensitive.read, capability: sensitive-file-read}
  unknown-sensitive-candidate:
    read: {id: path.unknown-sensitive-candidate.read, capability: sensitive-file-read}
  project:
    read: {id: path.project.read, capability: project-read}
    write: {id: path.project.write, capability: project-write}
  sensitive:
    read:
      id: path.sensitive.read
      capability: credential-read
      additional-capabilities:
        - sensitive-file-read
  state:
    read: {id: path.state.read, capability: state-read}
    write: {id: path.state.write, capability: state-write}
  device:
    read: {id: path.device.read, capability: device-access}
    write: {id: path.device.write, capability: device-access}
  persistence:
    read: {id: path.persistence.read, capability: persistence}
    write: {id: path.persistence.write, capability: persistence}
  system:
    write: {id: path.system.write, capability: system-modification}
