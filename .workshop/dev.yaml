name: dev
base: ubuntu@26.04
sdks:
  - name: go
    channel: 1.27/stable

actions:
  format: |
    files="$(find cmd internal -type f -name '*.go')"
    gofmt -w $files

  format-check: |
    files="$(find cmd internal -type f -name '*.go')"
    unformatted="$(gofmt -l $files)"
    if [ -n "$unformatted" ]; then
      printf 'The following Go files need formatting:\n%s\n' "$unformatted" >&2
      exit 1
    fi

  vet: go vet ./...

  test: go test ./...

  check: |
    files="$(find cmd internal -type f -name '*.go')"
    unformatted="$(gofmt -l $files)"
    if [ -n "$unformatted" ]; then
      printf 'The following Go files need formatting:\n%s\n' "$unformatted" >&2
      exit 1
    fi
    go vet ./...
    go test ./...

  e2e: bash testdata/e2e/run.sh

  build: |
    mkdir -p build
    version="$(git describe --tags --exact-match 2>/dev/null || printf 'dev')"
    commit="$(git rev-parse --short=12 HEAD)"
    build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
    ldflags="-X github.com/shizuku198411/Latra/internal/buildinfo.Version=$version"
    ldflags="$ldflags -X github.com/shizuku198411/Latra/internal/buildinfo.Commit=$commit"
    ldflags="$ldflags -X github.com/shizuku198411/Latra/internal/buildinfo.BuildDate=$build_date"
    go build -trimpath -ldflags "$ldflags" -o build/latra ./cmd/latra

  latra: go run ./cmd/latra "$@"
